name: Manual root integration test

on:
  workflow_dispatch:
    inputs:
      script:
        description: Root-level script to test on a disposable Ubuntu runner
        required: true
        type: choice
        options:
          - fail2ban-ssh.sh
          - lynis-check.sh
          - unattended-upgrades.sh
      confirm_system_changes:
        description: I understand that the selected script modifies the runner as root
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  root-integration-test:
    name: Test ${{ inputs.script }} as root
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Confirm system changes
        env:
          CONFIRMED: ${{ inputs.confirm_system_changes }}
        run: |
          if [[ "$CONFIRMED" != "true" ]]; then
            echo "Root integration testing requires explicit confirmation." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select and statically check script
        id: selected
        env:
          REQUESTED_SCRIPT: ${{ inputs.script }}
        run: |
          set -euo pipefail

          case "$REQUESTED_SCRIPT" in
            fail2ban-ssh.sh|lynis-check.sh|unattended-upgrades.sh)
              script="$REQUESTED_SCRIPT"
              ;;
            *)
              echo "Script is not in the root-test allowlist: ${REQUESTED_SCRIPT}" >&2
              exit 1
              ;;
          esac

          [[ -f "$script" && -x "$script" ]] || {
            echo "Selected script is missing or is not executable: ${script}" >&2
            exit 1
          }
          bash -n "$script"
          shellcheck -x "$script"
          echo "script=${script}" >> "$GITHUB_OUTPUT"

      - name: Run selected script as root
        env:
          SCRIPT: ${{ steps.selected.outputs.script }}
        run: |
          set -euo pipefail
          echo "Running ${SCRIPT} as root on a disposable runner."
          sudo bash -o errexit -o nounset -o pipefail "$SCRIPT"

      - name: Verify integration result
        env:
          SCRIPT: ${{ steps.selected.outputs.script }}
        run: |
          set -euo pipefail

          case "$SCRIPT" in
            fail2ban-ssh.sh)
              sudo fail2ban-client -t
              sudo systemctl is-active --quiet fail2ban.service
              sudo fail2ban-client status sshd
              ;;
            lynis-check.sh)
              report_found=false
              while IFS= read -r -d '' report; do
                if [[ -s "$report" ]] && sudo grep -q '^hardening_index=' "$report"; then
                  echo "Validated Lynis report: ${report}"
                  report_found=true
                  break
                fi
              done < <(sudo find /var/log/cloud-setup/lynis -maxdepth 1 -type f \
                -name 'lynis-report-*.dat' -print0)
              "$report_found" || {
                echo "No non-empty Lynis report with a hardening index was found." >&2
                exit 1
              }
              ;;
            unattended-upgrades.sh)
              sudo apt-config dump >/dev/null
              sudo systemctl is-enabled --quiet unattended-upgrades.service
              sudo systemctl is-enabled --quiet apt-daily.timer
              sudo systemctl is-enabled --quiet apt-daily-upgrade.timer
              sudo test -s /etc/apt/apt.conf.d/20auto-upgrades
              sudo test -s /etc/apt/apt.conf.d/52my-custom-upgrades
              ;;
            *)
              echo "No integration assertions defined for ${SCRIPT}." >&2
              exit 1
              ;;
          esac

          echo "Root integration checks passed for ${SCRIPT}."
