name: GitHub Actions security

on:
  push:
    branches: ["main"]
    paths:
      - ".github/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/**"
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze GitHub Actions configuration
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true
          persona: regular
          version: "1.29.0"
